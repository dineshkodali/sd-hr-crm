name: sd-hr-crm-dev

services:
  backend-dev:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    container_name: crm-backend-dev
    command: npm run dev
    env_file:
      - path: .env
        required: false
      - path: Backend/.env
        required: false
    environment:
      NODE_ENV: development
      PORT: ${PORT:-4000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://sdcommercial:Dinesh%408008%23@18.130.77.174:5432/new_CRM}
      PGHOST: ${PGHOST:-18.130.77.174}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${PGDATABASE:-new_CRM}
      PGUSER: ${PGUSER:-sdcommercial}
      PGPASSWORD: ${PGPASSWORD:-Dinesh@8008#}
      JWT_SECRET: ${JWT_SECRET:-8ada8990-4c3a-4a54-af8b-7fcf236c0738-sd-hr-crm-dev-secret}
    ports:
      - "4000:4000"
    volumes:
      - ./Backend:/app
      - /app/node_modules
    networks:
      - crm-dev-network

  frontend-dev:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: crm-frontend-dev
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_URL: http://localhost:4000/api
    ports:
      - "3002:5173"
    volumes:
      - ./frontend:/build
      - /build/node_modules
    depends_on:
      - backend-dev
    networks:
      - crm-dev-network

networks:
  crm-dev-network:
    driver: bridge
