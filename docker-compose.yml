version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: crm-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_password}
      POSTGRES_DB: ${DB_NAME:-hr_crm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  backend:
    build:
      context: .
      target: backend
    container_name: crm-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres_password}@db:5432/${DB_NAME:-hr_crm}
      JWT_SECRET: ${JWT_SECRET:-secret}
      PORT: 4000
      NODE_ENV: production
    depends_on:
      - db
    networks:
      - app-network
    ports:
      - "4000:4000"

  frontend:
    build:
      context: .
      target: frontend
    container_name: crm-frontend
    restart: always
    depends_on:
      - backend
    networks:
      - app-network
    ports:
      - "3002:3002"

volumes:
  postgres_data:

networks:
  app-network:
    external: true

