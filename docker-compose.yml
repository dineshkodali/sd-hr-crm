version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: hr-crm-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_password}
      POSTGRES_DB: ${DB_NAME:-hr_crm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always

  backend:
    build: ./Backend
    container_name: hr-crm-backend
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres_password}@db:5432/${DB_NAME:-hr_crm}
      - JWT_SECRET=${JWT_SECRET:-secret}
      - PORT=4000
      - NODE_ENV=production
      - CORS_ORIGINS=http://localhost
    depends_on:
      - db
    ports:
      - "4000:4000"
    restart: always

  frontend:
    build: ./frontend
    container_name: hr-crm-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
