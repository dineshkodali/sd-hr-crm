version: '3.8'

services:
  # db service removed; using remote DB

  backend:
    build:
      context: .
      target: backend
    container_name: crm-backend
    env_file:
      - ./Backend/.env
    environment:
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      - PORT=4000
      - NODE_ENV=production
      - CORS_ORIGINS=https://crm.sdgsolutions.in,http://localhost:3002,http://localhost:3000,http://192.168.0.4:3002,http://frontend:80
    ports:
      - "4000:4000"
    networks:
      - crm-network
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      target: frontend
    container_name: crm-frontend
    ports:
      - "3002:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - crm-network
    restart: always
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  crm-network:
    driver: bridge
